direct_blocked_phrases:
  - "delete all documents"
  - "delete every document"
  - "remove all documents"
  - "wipe corpus"
  - "clear corpus"
  - "drop corpus"
  - "delete vectors"
  - "delete existing vectors"
  - "clear qdrant"
  - "wipe qdrant"
  - "remove all chunks"
  - "delete all chunks"
  - "reingest every document"
